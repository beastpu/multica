# Enables the in-process k8s cloud runtime (kubefleet) on the test
# environment. Pairs with `../../cloud-runtime/rbac.yaml` in this overlay's
# `resources:` — that manifest creates the `multica-server` ServiceAccount and
# the ClusterRole/Binding kubefleet needs to create per-workspace namespaces,
# StatefulSets and Secrets in-cluster.
#
# Non-secret provider config lives here (inline env). The two SECRETS it needs —
# MULTICA_CLOUD_RUNTIME_SECRET_KEY (secretbox master key for workspace LLM keys)
# and MULTICA_CLOUD_RUNTIME_PULL_SECRET_DOCKERCONFIGJSON (registry creds copied
# into each node namespace so the runtime image can be pulled) — arrive via the
# `envFrom: secretRef: multica-secrets` the base deployment already declares.
# Add them to the out-of-band Secret (see this overlay's README, cloud-runtime
# section). Both empty ⇒ feature reports not-configured; it does not crash.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multica-server
spec:
  template:
    spec:
      # Binds the pod to the SA that carries the cloud-runtime ClusterRole.
      # Without this the server runs as `default` and every node create 403s.
      serviceAccountName: multica-server
      containers:
        - name: server
          env:
            - name: MULTICA_CLOUD_RUNTIME_PROVIDER
              value: k8s
            # Runtime node image (ops-built, decoupled entrypoint). Bump when a
            # new runtime image ships; independent of the server/web tags.
            - name: MULTICA_CLOUD_RUNTIME_IMAGE
              value: lilith-registry.cn-shanghai.cr.aliyuncs.com/yunwei/multica:decoupled-f3f51eb
            # In-cluster Service DNS — node pods poll the server over the
            # cluster network, not the public ingress.
            - name: MULTICA_CLOUD_RUNTIME_SERVER_URL
              value: http://multica-server:8080
            # Namespace prefix (default mrt-) and per-workspace node cap
            # (default 3) are left at their code defaults. Storage class is
            # left empty ⇒ the cluster's default StorageClass provisions node
            # volumes. Set MULTICA_CLOUD_RUNTIME_STORAGE_CLASS to override.
