apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - feature-flags.yaml
  # Standalone Fleet service (node provisioning + mcn_ token authority +
  # workspace env), provisioning into the external cloud-runtime cluster.
  - fleet.yaml

commonAnnotations:
  multica.lilithgames.com/environment: "prod"

# Pin the deployed image tag per rollout. CI sets this via:
#   cd deploy/k8s/overlays/prod && kustomize edit set image \
#     lilith-registry.cn-shanghai.cr.aliyuncs.com/devops/multica-server=...:${GIT_SHA} \
#     lilith-registry.cn-shanghai.cr.aliyuncs.com/devops/multica-web=...:${GIT_SHA}
images:
  - name: lilith-registry.cn-shanghai.cr.aliyuncs.com/devops/multica-server
    newTag: "0.4.4"
  - name: lilith-registry.cn-shanghai.cr.aliyuncs.com/devops/multica-web
    newTag: "0.4.4"

patches:
  # Cloud runtime: point the server at the in-cluster Fleet service and mount
  # the per-workspace feature-flags file.
  - path: cloud-runtime-patch.yaml
    target:
      kind: Deployment
      name: multica-server

replicas:
  - name: multica-server
    # 2 replicas now that REDIS_URL is wired to the prod Tair
    # (alicloud_kvstore_instance.tair_prod, see deploy/tofu/prod.tf). The
    # sharded stream relay handles cross-pod WS fanout via XADD/XREAD on
    # Redis Streams. Bump further once relay health metrics stay clean.
    count: 2
  - name: multica-web
    count: 3   # stateless SSR, scale out freely
